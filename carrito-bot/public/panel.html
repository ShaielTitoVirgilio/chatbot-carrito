<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos - Carrito del Paseo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #eef0f3;
      --panel: #ffffff;
      --border: #dfe3e8;
      --text: #14181f;
      --muted: #667085;
      --red: #d92d20;
      --red-soft: #fef3f2;
      --blue: #1570ef;
      --purple: #7a3fd1;
      --green: #12a150;
      --green-dark: #0c7a3b;
      --amber: #b54708;
      --amber-soft: #fffaeb;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    body { display: flex; flex-direction: column; overflow: hidden; }
    button, input, textarea { font-family: inherit; font-size: inherit; }

    /* ---------- Barra superior ---------- */
    .top {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 16px;
      padding: 10px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 17px; font-weight: 800; }
    .brand .sub { color: var(--muted); font-weight: 600; }
    .live { width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
    .live.off { background: var(--red); }
    .top-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .updated { color: var(--muted); font-size: 12.5px; }
    .tbtn {
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
      border-radius: 8px; padding: 7px 13px; font-weight: 700; cursor: pointer;
    }
    .tbtn:hover { background: #f5f6f8; }
    .tbtn.sound-off { background: var(--amber-soft); border-color: #fedf89; color: var(--amber); }
    .tbtn.sound-on { background: #ecfdf3; border-color: #abefc6; color: var(--green-dark); }

    .banner {
      flex: 0 0 auto; display: none;
      padding: 9px 18px; background: var(--red-soft); color: #b42318;
      border-bottom: 1px solid #fecdca; font-weight: 600;
    }
    .banner.show { display: block; }

    /* ---------- Filtros (solo pantallas angostas) ---------- */
    .chips { display: none; gap: 8px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; }
    .chip {
      flex: 0 0 auto; border: 1px solid var(--border); background: var(--panel);
      border-radius: 999px; padding: 7px 14px; font-weight: 700; cursor: pointer; color: var(--text);
    }
    .chip.active { background: var(--text); color: #fff; border-color: var(--text); }

    /* ---------- Tablero ---------- */
    .board {
      flex: 1 1 auto; min-height: 0;
      display: grid;
      grid-template-columns: 1.1fr 1.1fr 1fr;
      gap: 14px; padding: 14px;
    }
    .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    .col-head {
      flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
      padding: 0 4px 10px;
    }
    .col-title { font-size: 12.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
    .col-count {
      min-width: 24px; text-align: center; padding: 2px 8px; border-radius: 999px;
      background: #dfe3e8; font-weight: 800; font-size: 12.5px;
    }
    .col.nuevos .col-count { background: var(--red); color: #fff; }
    .col-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 2px 2px 20px; }
    .col-empty { color: var(--muted); text-align: center; padding: 36px 12px; font-size: 13.5px; }

    /* ---------- Tarjeta de pedido ---------- */
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-left: 5px solid var(--green);
      border-radius: 10px; padding: 13px 14px; margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(16,24,40,.06);
    }
    .card.st-confirmed { border-left-color: var(--blue); }
    .card.st-ready, .card.st-on_the_way { border-left-color: var(--purple); }
    .card.closed { border-left-color: #98a2b3; background: #f9fafb; }
    .card.closed.rejected { border-left-color: var(--red); }
    .card.urgent { border-left-color: var(--red); box-shadow: 0 0 0 2px rgba(217,45,32,.18); }

    .c-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .c-num { font-size: 18px; font-weight: 800; }
    .pill { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; letter-spacing: .3px; text-transform: uppercase; }
    .pill.delivery { background: #eff4ff; color: #175cd3; }
    .pill.retiro { background: #f4f3ff; color: #5925dc; }
    .pill.wa { background: #ecfdf3; color: var(--green-dark); }
    .pill.pago-efectivo { background: #ecfdf3; color: var(--green-dark); }
    .pill.pago-transferencia { background: #fff4e5; color: #b54708; border: 1px solid #fec84b; }
    .pill.estado { background: #f2f4f7; color: #344054; }
    .pill.estado.rejected { background: var(--red-soft); color: #b42318; }
    .c-age { margin-left: auto; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
    .c-age.urgent { color: var(--red); font-weight: 800; }

    .c-cliente { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .c-cliente span { font-weight: 500; color: var(--muted); }
    .c-line { color: #344054; margin: 2px 0; line-height: 1.4; }
    .c-line em { color: var(--muted); font-style: normal; }
    .c-note { background: var(--amber-soft); border: 1px solid #fedf89; color: #7a2e0e; border-radius: 8px; padding: 7px 10px; margin: 8px 0; }
    .c-reason { background: var(--red-soft); border: 1px solid #fecdca; color: #912018; border-radius: 8px; padding: 7px 10px; margin: 8px 0; }

    .items { background: #f9fafb; border: 1px solid #eaecf0; border-radius: 8px; padding: 6px 11px; margin: 9px 0; }
    .it { padding: 6px 0; }
    .it + .it { border-top: 1px dashed #d0d5dd; }
    .it-main { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
    .it-main b { font-weight: 800; }
    .it-opts { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
    .it-note {
      color: #93370d; background: var(--amber-soft); border: 1px solid #fedf89;
      font-size: 14.5px; font-weight: 700; line-height: 1.35;
      border-radius: 6px; padding: 4px 8px; margin-top: 5px;
    }
    .items.compact .it { padding: 3px 0; }
    .items.compact .it + .it { border-top: none; }

    .totals { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-size: 15px; padding-top: 2px; }
    .totals small { color: var(--muted); font-weight: 600; font-size: 12.5px; }

    .fee-row { display: flex; align-items: flex-end; gap: 10px; margin: 12px 0 4px; flex-wrap: wrap; }
    .fld label { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .3px; }
    .fld input {
      width: 100px; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 8px; background: #fff;
    }
    .fld input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(21,112,239,.15); }
    .fld input.error { border-color: var(--red); box-shadow: 0 0 0 3px rgba(217,45,32,.15); }
    .fee-total { margin-left: auto; text-align: right; color: var(--muted); font-size: 12.5px; }
    .fee-total b { display: block; color: var(--text); font-size: 18px; }

    .btns { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
    .btn {
      border: 1px solid transparent; border-radius: 8px; padding: 9px 15px; font-weight: 800; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; line-height: 1.2;
    }
    .btn.primary { background: var(--blue); color: #fff; }
    .btn.primary:hover { background: #175cd3; }
    .btn.ready { background: var(--purple); color: #fff; }
    .btn.ready:hover { background: #6927b4; }
    .btn.done { background: var(--green); color: #fff; }
    .btn.done:hover { background: var(--green-dark); }
    .btn.cancel { background: #fff; color: #b42318; border-color: #fda29b; }
    .btn.cancel:hover { background: var(--red-soft); }
    .btn.wa { background: #fff; color: var(--green-dark); border-color: #75e0a7; }
    .btn.wa:hover { background: #ecfdf3; }
    .btn.disabled { opacity: .5; cursor: not-allowed; }
    .btn:disabled { opacity: .55; cursor: wait; }

    /* tarjetas plegables (En preparación y Listos): resumen + detalle al tocar */
    .c-resumen { cursor: pointer; border-radius: 6px; margin: -4px -6px; padding: 4px 6px; }
    .c-resumen:hover { background: #f5f6f8; }
    .c-resumen:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .r-pie { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .r-izq { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; min-width: 0; }
    .r-der { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .r-cant { color: #344054; font-weight: 600; }
    .pill.coment { background: var(--amber-soft); color: var(--amber); }
    .r-total { font-weight: 800; font-size: 15px; }
    .r-toggle {
      flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      background: #eff4ff; color: var(--blue); font-size: 12px; transition: transform .15s;
    }
    .c-resumen[aria-expanded="true"] .r-toggle { transform: rotate(180deg); }
    .c-detalle { margin-top: 10px; padding-top: 4px; border-top: 1px solid #eaecf0; }

    /* fila compacta del historial */
    .h-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .h-row .c-num { font-size: 15px; }
    .h-row .h-total { margin-left: auto; font-weight: 800; }

    /* ---------- Modal ---------- */
    .modal-bg { position: fixed; inset: 0; background: rgba(16,24,40,.5); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
    .modal-bg.show { display: flex; }
    .modal { background: #fff; border-radius: 14px; padding: 22px; width: 100%; max-width: 480px; box-shadow: 0 20px 50px rgba(16,24,40,.3); }
    .modal h2 { font-size: 18px; margin-bottom: 4px; }
    .modal p.hint { color: var(--muted); margin-bottom: 14px; }
    .motivo { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
    .motivo:hover { background: #f9fafb; }
    .motivo.sel { border-color: var(--blue); background: #eff8ff; }
    .motivo input { margin-top: 3px; }
    .modal textarea { width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 9px 11px; margin-top: 4px; resize: vertical; min-height: 64px; }
    .modal textarea:focus { outline: none; border-color: var(--blue); }
    .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .modal .sin-tel { background: var(--amber-soft); border: 1px solid #fedf89; color: #7a2e0e; border-radius: 8px; padding: 9px 11px; margin-top: 4px; }

    /* ---------- Avisos ---------- */
    .toast {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #101828; color: #fff; padding: 11px 20px; border-radius: 10px; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 60; max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #b42318; }
    .wa-fallback {
      position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); z-index: 60;
      background: #fff; border: 1px solid #75e0a7; border-radius: 12px; padding: 12px 16px;
      box-shadow: 0 10px 30px rgba(16,24,40,.25); display: none; align-items: center; gap: 14px;
    }
    .wa-fallback.show { display: flex; }

    /* ---------- Pantallas angostas: un estado a la vez ---------- */
    @media (max-width: 1050px) {
      .chips { display: flex; }
      .board { grid-template-columns: 1fr; padding: 10px; }
      .col { display: none; }
      .col.active { display: flex; }
    }
  </style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="live" id="live" title="Conectado"></span>
    <h1>Carrito del Paseo</h1>
    <span class="sub">Pedidos</span>
  </div>
  <div class="top-right">
    <span class="updated" id="updated"></span>
    <button class="tbtn sound-off" id="sound-btn" type="button">Aviso sonoro: apagado</button>
    <button class="tbtn" id="refresh-btn" type="button">Actualizar</button>
    <a class="tbtn" href="/editar" style="text-decoration:none">Editar menú</a>
  </div>
</header>

<div class="banner" id="banner">No se pudo actualizar la lista de pedidos. Reintentando...</div>

<nav class="chips" id="chips"></nav>

<main class="board" id="board">
  <div class="col-empty">Cargando pedidos...</div>
</main>

<!-- Cancelar pedido -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Cancelar pedido</h2>
    <p class="hint" id="modal-hint"></p>
    <div id="motivos"></div>
    <textarea id="motivo-otro" placeholder="Escribí el motivo que le va a llegar al cliente" hidden></textarea>
    <div class="modal-btns">
      <button class="btn wa" type="button" id="modal-volver">Volver</button>
      <button class="btn cancel" type="button" id="modal-ok">Cancelar pedido y avisar</button>
    </div>
  </div>
</div>

<!-- Avisar por WhatsApp al pasar a Listo / En camino -->
<div class="modal-bg" id="aviso-bg">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="aviso-title">
    <h2 id="aviso-title">Avisar al cliente</h2>
    <p class="hint" id="aviso-hint"></p>
    <div class="sin-tel" id="aviso-sin-tel" hidden>Este pedido no tiene un teléfono válido, así que no se puede avisar por WhatsApp.</div>
    <div class="modal-btns">
      <button class="btn wa" type="button" id="aviso-volver">Volver</button>
      <button class="btn cancel" type="button" id="aviso-no">No avisar</button>
      <button class="btn done" type="button" id="aviso-si">Sí, avisar por WhatsApp</button>
    </div>
  </div>
</div>

<div class="wa-fallback" id="wa-fallback">
  <span>El navegador bloqueó la ventana de WhatsApp.</span>
  <a class="btn done" id="wa-fallback-link" href="#" target="_blank" rel="noopener">Abrir WhatsApp</a>
  <button class="btn wa" type="button" id="wa-fallback-close">Cerrar</button>
</div>

<div class="toast" id="toast"></div>

<script>
  // =========================================================
  //  Panel de pedidos
  //  - Solo pedidos: el inbox de WhatsApp se saco (el bot esta apagado).
  //  - Confirmar / Listo / Cancelar guardan el cambio y abren WhatsApp con un
  //    mensaje ya escrito. El boton "WhatsApp" abre el chat vacio.
  // =========================================================

  const POLL_MS = 5000;
  const URGENTE_MIN = 5;
  const BASE_TITLE = "Pedidos - Carrito del Paseo";

  const CERRADOS = ["delivered", "done", "rejected", "cancelled", "resolved", "manual"];
  const COLUMNAS = [
    { id: "nuevos",      titulo: "Nuevos",             estados: ["pending"],                 vacio: "No hay pedidos nuevos." },
    { id: "preparacion", titulo: "En preparación",     estados: ["confirmed"],               vacio: "Nada en preparación." },
    // Listos y cerrados van juntos: en la practica nadie marcaba "Entregado",
    // asi que una columna aparte de historial no servia para nada.
    { id: "listos",      titulo: "Listos / Cancelados", estados: ["ready", "on_the_way", ...CERRADOS], vacio: "Nada listo todavía." },
  ];

  const ESTADO_LABEL = {
    pending: "Nuevo", confirmed: "En preparación", ready: "Listo", on_the_way: "En camino",
    delivered: "Entregado", done: "Entregado", rejected: "Cancelado", cancelled: "Cancelado",
    resolved: "Resuelto", manual: "Manual",
  };

  const MOTIVOS = [
    "No llegamos a esa zona, pero lo podés pasar a buscar por el local.",
    "Hoy estamos con mucha demora y no llegamos con ese pedido.",
    "Se nos terminó uno de los productos del pedido.",
  ];

  const state = {
    orders: [],
    drafts: {},               // lo tipeado (envio/demora) por pedido: sobrevive a los refrescos
    vistos: new Set(),
    primeraCarga: true,
    firma: "",
    filtro: "nuevos",
    sonido: localStorage.getItem("cdp_sonido") === "1",
    error: false,
    cancelando: null,         // id del pedido en el modal de cancelar
    avisando: null,           // id del pedido en el modal de "avisar por WhatsApp"
    abiertos: new Set(),      // tarjetas desplegadas, por "id:estado" (al cambiar de columna vuelven a plegarse)
  };

  const $ = (id) => document.getElementById(id);

  function esc(v) {
    return String(v ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  const money = (n) => "$" + Number(n || 0);
  const draft = (id) => (state.drafts[id] ||= { fee: "", eta: "" });
  const find = (id) => state.orders.find((o) => o.id === id);

  // created_at viene de Postgres sin zona horaria (es UTC): se fuerza la Z.
  function fecha(iso) {
    if (!iso) return null;
    return new Date(/Z|[+-]\d{2}:?\d{2}$/.test(iso) ? iso : iso + "Z");
  }
  function minutosDesde(iso) {
    const d = fecha(iso);
    return d ? Math.max(0, Math.floor((Date.now() - d) / 60000)) : 0;
  }
  function hora(iso) {
    const d = fecha(iso);
    return d ? d.toLocaleTimeString("es-UY", { hour: "2-digit", minute: "2-digit", timeZone: "America/Montevideo" }) : "";
  }
  function textoEdad(min) {
    if (min < 1) return "recién";
    if (min < 60) return min + " min";
    return Math.floor(min / 60) + " h " + (min % 60) + " min";
  }

  // ---------------- Sonido ----------------
  let audioCtx = null;
  function audio() {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function beep() {
    try {
      const c = audio();
      [0, 0.22, 0.44].forEach((t) => {
        const osc = c.createOscillator(), gain = c.createGain();
        osc.connect(gain); gain.connect(c.destination);
        osc.type = "sine"; osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.001, c.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.4, c.currentTime + t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + t + 0.18);
        osc.start(c.currentTime + t); osc.stop(c.currentTime + t + 0.2);
      });
    } catch {}
  }
  function pintarSonido() {
    const b = $("sound-btn");
    b.textContent = state.sonido ? "Aviso sonoro: encendido" : "Aviso sonoro: apagado";
    b.className = "tbtn " + (state.sonido ? "sound-on" : "sound-off");
  }
  $("sound-btn").addEventListener("click", () => {
    state.sonido = !state.sonido;
    localStorage.setItem("cdp_sonido", state.sonido ? "1" : "0");
    pintarSonido();
    if (state.sonido) { beep(); toast("Aviso sonoro encendido"); }
  });
  // Los navegadores no dejan sonar hasta que hay una interaccion: al primer
  // click en la pagina se destraba el audio si ya estaba encendido.
  document.addEventListener("pointerdown", () => { if (state.sonido) audio(); });

  // ---------------- Avisos ----------------
  let toastTimer;
  function toast(msg, error) {
    const t = $("toast");
    t.textContent = msg;
    t.className = "toast show" + (error ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.className = "toast"), error ? 5000 : 2600);
  }
  function mostrarFallbackWa(url) {
    $("wa-fallback-link").href = url;
    $("wa-fallback").classList.add("show");
  }
  $("wa-fallback-close").addEventListener("click", () => $("wa-fallback").classList.remove("show"));
  $("wa-fallback-link").addEventListener("click", () => $("wa-fallback").classList.remove("show"));

  // ---------------- Carga ----------------
  async function cargar(feedback) {
    try {
      const res = await fetch("/api/orders");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("respuesta inesperada");

      const nuevos = data.filter((o) => o.status === "pending" && !state.vistos.has(o.id));
      data.forEach((o) => state.vistos.add(o.id));
      state.orders = data;
      state.error = false;

      // Solo se vuelve a dibujar si algo cambio: dibujar de nuevo borra lo que
      // el empleado esta tipeando en envio o demora.
      const firma = JSON.stringify(data.map((o) => [o.id, o.status, o.total, o.delivery_fee, o.eta_minutes, o.rejected_reason]));
      if (firma !== state.firma) { state.firma = firma; dibujar(); }

      if (!state.primeraCarga && nuevos.length && state.sonido) beep();
      state.primeraCarga = false;
      if (feedback) toast("Lista actualizada");
    } catch (e) {
      state.error = true;
      if (feedback) toast("No se pudo actualizar", true);
    }
    $("live").className = "live" + (state.error ? " off" : "");
    $("banner").classList.toggle("show", state.error);
    $("updated").textContent = state.error ? "" : "Actualizado " + new Date().toLocaleTimeString("es-UY", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  // ---------------- Dibujo ----------------
  function itemsHtml(o, compact) {
    const items = Array.isArray(o.items) ? o.items : [];
    if (!items.length) return "";
    const filas = items.map((i) => {
      const cant = i.cantidad || 1;
      const precio = i.precio_linea != null ? i.precio_linea : (i.precio || 0) * cant;
      let opciones = "";
      if (!compact) {
        if (i.opciones && typeof i.opciones === "object") {
          opciones = Object.entries(i.opciones)
            .filter(([, v]) => Array.isArray(v) && v.length)
            .map(([g, v]) => g.charAt(0).toUpperCase() + g.slice(1) + ": " + v.join(", "))
            .join(" · ");
        } else if (i.detalle) opciones = i.detalle;
      }
      return `<div class="it">
        <div class="it-main"><span><b>${esc(cant)}x</b> ${esc(i.nombre || "?")}</span><span>${money(precio)}</span></div>
        ${opciones ? `<div class="it-opts">${esc(opciones)}</div>` : ""}
        ${i.nota ? `<div class="it-note">"${esc(i.nota)}"</div>` : ""}
      </div>`;
    }).join("");
    return `<div class="items${compact ? " compact" : ""}">${filas}</div>`;
  }

  function botonChat(o) {
    return o.wa_chat_url
      ? `<a class="btn wa" href="${esc(o.wa_chat_url)}" target="_blank" rel="noopener">WhatsApp</a>`
      : `<span class="btn wa disabled" title="El pedido no tiene un teléfono válido">Sin teléfono</span>`;
  }

  // Solo delivery: avisa de un vistazo si hay que pasarle los datos de la cuenta.
  const PAGO_LABEL = { efectivo: "Efectivo", transferencia: "Transferencia" };
  function pillPago(o) {
    if (o.type !== "delivery" || !PAGO_LABEL[o.payment_method]) return "";
    return `<span class="pill pago-${esc(o.payment_method)}">${PAGO_LABEL[o.payment_method]}</span>`;
  }

  function cabecera(o, urgente) {
    const edad = minutosDesde(o.created_at);
    const tipo = o.type === "delivery" ? `<span class="pill delivery">Delivery</span>` : `<span class="pill retiro">Retiro</span>`;
    const canal = o.channel && o.channel !== "web" ? `<span class="pill wa">WhatsApp</span>` : "";
    return `<div class="c-top">
      <span class="c-num">${esc(o.order_number || "-")}</span>${tipo}${pillPago(o)}${canal}
      <span class="c-age${urgente ? " urgent" : ""}" data-created="${esc(o.created_at || "")}">${esc(hora(o.created_at))} · ${esc(textoEdad(edad))}</span>
    </div>`;
  }

  function lineaCliente(o) {
    const tel = o.contact_phone || o.customer_phone;
    return `<div class="c-cliente">${esc(o.customer_name || "Sin nombre")} <span>${tel ? "· " + esc(tel) : ""}</span></div>`;
  }
  function lineaEntrega(o) {
    return o.type === "delivery"
      ? `<div class="c-line"><em>Entrega:</em> ${esc(o.address || "sin dirección")}${o.address_details ? ` <em>(${esc(o.address_details)})</em>` : ""}</div>`
      : `<div class="c-line"><em>Retira en el local</em></div>`;
  }
  function pagoYNota(o) {
    const pago = o.payment_method
      ? `<div class="c-line"><em>Paga en</em> ${esc(o.payment_method)}${o.pays_with ? ` <em>· con</em> ${money(o.pays_with)}` : ""}</div>`
      : "";
    return `${pago}${o.customer_note ? `<div class="c-note">Nota del cliente: ${esc(o.customer_note)}</div>` : ""}`;
  }
  function datosCliente(o) {
    return lineaCliente(o) + lineaEntrega(o) + pagoYNota(o);
  }

  function cantidadProductos(o) {
    return (Array.isArray(o.items) ? o.items : []).reduce((n, i) => n + (Number(i.cantidad) || 1), 0);
  }
  function tieneComentarios(o) {
    return !!o.customer_note || (Array.isArray(o.items) && o.items.some((i) => i.nota));
  }

  // Tarjeta de En preparación / Listos: plegada muestra solo lo importante
  // (nombre, teléfono, dirección, tipo, total y cantidad de productos); al
  // tocarla se despliega `detalle` con los productos y los botones.
  function tarjetaPlegable(o, detalle) {
    const clave = o.id + ":" + o.status;
    const abierto = state.abiertos.has(clave);
    const n = cantidadProductos(o);
    return `<article class="card st-${esc(o.status)}" data-id="${esc(o.id)}">
      <div class="c-resumen" role="button" tabindex="0" aria-expanded="${abierto}" data-toggle="${esc(clave)}">
        ${cabecera(o, false)}
        ${lineaCliente(o)}
        ${o.type === "delivery" ? lineaEntrega(o) : ""}
        <div class="r-pie">
          <span class="r-izq">
            <span class="r-cant">${n} ${n === 1 ? "producto" : "productos"}</span>
            ${tieneComentarios(o) ? `<span class="pill coment">Con comentarios</span>` : ""}
          </span>
          <span class="r-der">
            <span class="r-total">${money(o.total)}</span>
            <span class="r-toggle" title="${abierto ? "Ocultar detalle" : "Ver detalle"}">▼</span>
          </span>
        </div>
      </div>
      ${abierto ? `<div class="c-detalle">${detalle}</div>` : ""}
    </article>`;
  }

  function tarjetaNueva(o) {
    const itemsTotal = Number(o.items_total ?? o.subtotal ?? o.total ?? 0);
    const urgente = minutosDesde(o.created_at) >= URGENTE_MIN;
    const d = draft(o.id);
    const envio = o.type === "delivery"
      ? `<div class="fld"><label for="fee-${esc(o.id)}">Envío $</label>
           <input id="fee-${esc(o.id)}" type="number" min="0" inputmode="numeric" placeholder="0" value="${esc(d.fee)}" data-id="${esc(o.id)}" data-field="fee"></div>`
      : "";
    return `<article class="card st-pending${urgente ? " urgent" : ""}" data-id="${esc(o.id)}">
      ${cabecera(o, urgente)}
      ${datosCliente(o)}
      ${itemsHtml(o, false)}
      <div class="totals"><span>Productos</span><span>${money(itemsTotal)}</span></div>
      <div class="fee-row">
        ${envio}
        <div class="fld"><label for="eta-${esc(o.id)}">Demora (min)</label>
          <input id="eta-${esc(o.id)}" type="number" min="0" inputmode="numeric" placeholder="30" value="${esc(d.eta)}" data-id="${esc(o.id)}" data-field="eta"></div>
        <div class="fee-total">Total<b id="tot-${esc(o.id)}" data-items="${itemsTotal}">${money(itemsTotal + (Number(d.fee) || 0))}</b></div>
      </div>
      <div class="btns">
        <button class="btn primary" type="button" data-act="confirmar" data-id="${esc(o.id)}">Confirmar</button>
        <button class="btn cancel" type="button" data-act="cancelar" data-id="${esc(o.id)}">Cancelar</button>
        ${botonChat(o)}
      </div>
    </article>`;
  }

  function tarjetaPreparacion(o) {
    const esDelivery = o.type === "delivery";
    const extra = [
      o.eta_minutes ? `Demora acordada: ${esc(o.eta_minutes)} min` : "",
      esDelivery && Number(o.delivery_fee) > 0 ? `Envío ${money(o.delivery_fee)}` : "",
    ].filter(Boolean).join(" · ");
    return tarjetaPlegable(o, `
      ${pagoYNota(o)}
      ${itemsHtml(o, false)}
      <div class="totals"><span>Total${extra ? ` <small>${extra}</small>` : ""}</span><span>${money(o.total)}</span></div>
      <div class="btns">
        <button class="btn ready" type="button" data-act="listo" data-id="${esc(o.id)}">${esDelivery ? "En camino" : "Listo para retirar"}</button>
        <button class="btn cancel" type="button" data-act="cancelar" data-id="${esc(o.id)}">Cancelar</button>
        ${botonChat(o)}
      </div>`);
  }

  function tarjetaLista(o) {
    return tarjetaPlegable(o, `
      ${pagoYNota(o)}
      ${itemsHtml(o, true)}
      <div class="totals"><span>Total</span><span>${money(o.total)}</span></div>
      <div class="btns">
        <button class="btn done" type="button" data-act="entregado" data-id="${esc(o.id)}">Entregado</button>
        ${botonChat(o)}
      </div>`);
  }

  function filaHistorial(o) {
    const cancelado = ["rejected", "cancelled"].includes(o.status);
    return `<article class="card closed${cancelado ? " rejected" : ""}" data-id="${esc(o.id)}">
      <div class="h-row">
        <span class="c-num">${esc(o.order_number || "-")}</span>
        <span class="pill estado${cancelado ? " rejected" : ""}">${esc(ESTADO_LABEL[o.status] || o.status)}</span>
        <span class="h-total">${money(o.total)}</span>
      </div>
      <div class="c-line">${esc(o.customer_name || "Sin nombre")} <em>· ${o.type === "delivery" ? "Delivery" : "Retiro"} · ${esc(hora(o.created_at))}</em></div>
      ${o.rejected_reason ? `<div class="c-reason">${esc(o.rejected_reason)}</div>` : ""}
      <div class="btns">${botonChat(o)}</div>
    </article>`;
  }

  function dibujar() {
    const board = $("board");

    // Se conserva el scroll de cada columna y el campo que se estaba tipeando.
    const scrolls = {};
    board.querySelectorAll(".col").forEach((c) => (scrolls[c.dataset.col] = c.querySelector(".col-body").scrollTop));
    const a = document.activeElement;
    const foco = a && a.dataset && a.dataset.field ? { id: a.dataset.id, field: a.dataset.field, pos: a.selectionStart } : null;

    const ordenAsc = (a, b) => (fecha(a.created_at) || 0) - (fecha(b.created_at) || 0);
    const ordenDesc = (a, b) => ordenAsc(b, a);

    board.innerHTML = COLUMNAS.map((col) => {
      let lista = state.orders.filter((o) => col.estados.includes(o.status));
      // Los que esperan hace mas van arriba; abajo los cerrados, el ultimo primero.
      const abiertos = lista.filter((o) => !CERRADOS.includes(o.status)).sort(ordenAsc);
      const cerrados = lista.filter((o) => CERRADOS.includes(o.status)).sort(ordenDesc);
      lista = [...abiertos, ...cerrados];
      const dibujoCol = { nuevos: tarjetaNueva, preparacion: tarjetaPreparacion, listos: tarjetaLista }[col.id];
      const dibujo = (o) => CERRADOS.includes(o.status) ? filaHistorial(o) : dibujoCol(o);
      return `<section class="col ${col.id}${state.filtro === col.id ? " active" : ""}" data-col="${col.id}">
        <div class="col-head"><span class="col-title">${esc(col.titulo)}</span><span class="col-count">${lista.length}</span></div>
        <div class="col-body">${lista.length ? lista.map(dibujo).join("") : `<div class="col-empty">${esc(col.vacio)}</div>`}</div>
      </section>`;
    }).join("");

    board.querySelectorAll(".col").forEach((c) => { if (scrolls[c.dataset.col]) c.querySelector(".col-body").scrollTop = scrolls[c.dataset.col]; });
    if (foco) {
      const el = document.getElementById(foco.field + "-" + foco.id);
      if (el) { el.focus(); try { el.setSelectionRange(foco.pos, foco.pos); } catch {} }
    }

    // Filtros para pantallas angostas
    $("chips").innerHTML = COLUMNAS.map((col) => {
      const n = state.orders.filter((o) => col.estados.includes(o.status)).length;
      return `<button class="chip${state.filtro === col.id ? " active" : ""}" type="button" data-filtro="${col.id}">${esc(col.titulo)} ${n}</button>`;
    }).join("");

    actualizarTitulo();
  }

  // Las edades ("hace 7 min") y el rojo de urgente se actualizan sin volver a
  // dibujar las tarjetas.
  function refrescarEdades() {
    document.querySelectorAll(".c-age[data-created]").forEach((el) => {
      const iso = el.dataset.created;
      const min = minutosDesde(iso);
      el.textContent = hora(iso) + " · " + textoEdad(min);
      const card = el.closest(".card");
      const nuevo = card && card.classList.contains("st-pending");
      const urgente = nuevo && min >= URGENTE_MIN;
      el.classList.toggle("urgent", urgente);
      card.classList.toggle("urgent", urgente);
    });
  }

  function pendientes() { return state.orders.filter((o) => o.status === "pending").length; }
  let parpadeo = false;
  function actualizarTitulo() {
    const n = pendientes();
    if (!n) { document.title = BASE_TITLE; return; }
    document.title = (document.hidden && parpadeo ? "NUEVO PEDIDO" : "(" + n + ") Pedidos nuevos") + " - Carrito del Paseo";
  }
  setInterval(() => { parpadeo = !parpadeo; actualizarTitulo(); }, 1000);
  setInterval(refrescarEdades, 20000);

  // ---------------- Acciones ----------------
  async function post(path, body) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Error " + res.status);
    return data;
  }

  // La ventana se abre EN EL CLICK y despues se le carga el link: abrir una
  // ventana despues de esperar la respuesta del servidor suele bloquearse.
  function abrirVentanaWa() {
    const w = window.open("", "_blank");
    if (w) {
      try {
        w.opener = null;
        w.document.title = "WhatsApp";
        w.document.body.style.cssText = "font-family:sans-serif;padding:28px;color:#344054";
        w.document.body.textContent = "Abriendo WhatsApp...";
      } catch {}
    }
    return w;
  }
  function terminarWa(w, data) {
    if (data.wa_url) {
      if (w) w.location.href = data.wa_url;
      else mostrarFallbackWa(data.wa_url);
    } else {
      if (w) w.close();
      toast("Se guardó, pero el pedido no tiene un teléfono válido para WhatsApp.", true);
    }
  }

  async function confirmar(id) {
    const o = find(id); if (!o) return;
    const d = draft(id);
    const esDelivery = o.type === "delivery";

    // El envio es obligatorio en delivery (0 si es gratis): es lo que se cobra.
    if (esDelivery && String(d.fee).trim() === "") {
      const el = $("fee-" + id);
      if (el) { el.classList.add("error"); el.focus(); }
      toast("Poné el costo del envío (0 si no se cobra).", true);
      return;
    }
    const fee = esDelivery ? Math.max(0, Number(d.fee) || 0) : 0;
    const eta = Number(d.eta) > 0 ? Number(d.eta) : null;

    const w = abrirVentanaWa();
    try {
      const data = await post(`/api/orders/${id}/confirm`, { delivery_fee: fee, eta_minutes: eta });
      terminarWa(w, data);
      delete state.drafts[id];
      toast("Pedido confirmado");
      await cargar();
    } catch (e) {
      if (w) w.close();
      toast("No se pudo confirmar: " + e.message, true);
    }
  }

  // Pasar a "Listo / En camino": primero se pregunta si se avisa por WhatsApp.
  // Si (avisar=true) se abre WhatsApp con el mensaje escrito; No solo cambia de
  // columna. En los dos casos el pedido pasa a la columna siguiente.
  async function pasarAListo(id, avisar) {
    const w = avisar ? abrirVentanaWa() : null;
    try {
      const data = await post(`/api/orders/${id}/ready`);
      if (avisar) terminarWa(w, data);
      toast(avisar ? "Pedido actualizado y cliente avisado" : "Pedido actualizado");
      await cargar();
    } catch (e) {
      if (w) w.close();
      toast("No se pudo actualizar: " + e.message, true);
    }
  }

  function abrirAviso(id) {
    const o = find(id); if (!o) return;
    state.avisando = id;
    const esDelivery = o.type === "delivery";
    $("aviso-title").textContent = esDelivery ? "Pedido en camino" : "Pedido listo para retirar";
    $("aviso-hint").textContent = `¿Querés avisarle por WhatsApp a ${o.customer_name || "el cliente"} que el pedido ${o.order_number} ${esDelivery ? "ya salió en camino" : "ya está listo para retirar"}?`;
    const hayTel = !!o.wa_chat_url;
    $("aviso-sin-tel").hidden = hayTel;
    $("aviso-si").hidden = !hayTel;
    $("aviso-no").textContent = hayTel ? "No avisar" : "Pasar igual";
    $("aviso-bg").classList.add("show");
  }
  function cerrarAviso() { $("aviso-bg").classList.remove("show"); state.avisando = null; }

  // Los botones abren la ventana de WhatsApp en el mismo click (ver abrirVentanaWa).
  $("aviso-si").addEventListener("click", () => { const id = state.avisando; cerrarAviso(); if (id) pasarAListo(id, true); });
  $("aviso-no").addEventListener("click", () => { const id = state.avisando; cerrarAviso(); if (id) pasarAListo(id, false); });
  $("aviso-volver").addEventListener("click", cerrarAviso);
  $("aviso-bg").addEventListener("click", (e) => { if (e.target === $("aviso-bg")) cerrarAviso(); });

  async function entregado(id) {
    try {
      await post(`/api/orders/${id}/delivered`);
      toast("Pedido entregado");
      await cargar();
    } catch (e) {
      toast("No se pudo actualizar: " + e.message, true);
    }
  }

  // ---- Cancelar (con motivo) ----
  function abrirModal(id) {
    const o = find(id); if (!o) return;
    state.cancelando = id;
    $("modal-hint").textContent = `Pedido ${o.order_number} de ${o.customer_name || "sin nombre"}. Este mensaje le llega al cliente por WhatsApp.`;
    $("motivos").innerHTML = MOTIVOS.map((m, i) =>
      `<label class="motivo${i === 0 ? " sel" : ""}"><input type="radio" name="motivo" value="${i}" ${i === 0 ? "checked" : ""}><span>${esc(m)}</span></label>`
    ).join("") + `<label class="motivo"><input type="radio" name="motivo" value="otro"><span>Otro motivo</span></label>`;
    $("motivo-otro").value = "";
    $("motivo-otro").hidden = true;
    $("modal-bg").classList.add("show");
  }
  function cerrarModal() { $("modal-bg").classList.remove("show"); state.cancelando = null; }

  $("motivos").addEventListener("change", (e) => {
    document.querySelectorAll("#motivos .motivo").forEach((l) => l.classList.toggle("sel", l.contains(e.target) && e.target.checked));
    const otro = e.target.value === "otro";
    $("motivo-otro").hidden = !otro;
    if (otro) $("motivo-otro").focus();
  });
  $("modal-volver").addEventListener("click", cerrarModal);
  $("modal-bg").addEventListener("click", (e) => { if (e.target === $("modal-bg")) cerrarModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { cerrarModal(); cerrarAviso(); } });

  $("modal-ok").addEventListener("click", async () => {
    const id = state.cancelando; if (!id) return;
    const sel = document.querySelector("#motivos input:checked");
    const motivo = sel && sel.value !== "otro" ? MOTIVOS[Number(sel.value)] : $("motivo-otro").value.trim();
    if (!motivo) { toast("Escribí el motivo de la cancelación.", true); $("motivo-otro").focus(); return; }

    const w = abrirVentanaWa();
    try {
      const data = await post(`/api/orders/${id}/reject`, { motivo });
      cerrarModal();
      terminarWa(w, data);
      toast("Pedido cancelado");
      await cargar();
    } catch (e) {
      if (w) w.close();
      toast("No se pudo cancelar: " + e.message, true);
    }
  });

  // ---------------- Eventos del tablero ----------------
  function plegar(clave) {
    if (state.abiertos.has(clave)) state.abiertos.delete(clave);
    else state.abiertos.add(clave);
    dibujar();
    const el = document.querySelector(`[data-toggle="${CSS.escape(clave)}"]`);
    if (el) el.focus({ preventScroll: true });
  }

  $("board").addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (b) {
      const id = b.dataset.id;
      ({ confirmar, listo: abrirAviso, entregado, cancelar: abrirModal }[b.dataset.act] || (() => {}))(id);
      return;
    }
    const t = e.target.closest("[data-toggle]");
    // Si se esta seleccionando texto (para copiar el telefono o la direccion) no se pliega.
    if (t && !String(window.getSelection())) plegar(t.dataset.toggle);
  });

  $("board").addEventListener("keydown", (e) => {
    const t = e.target.closest && e.target.closest("[data-toggle]");
    if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); plegar(t.dataset.toggle); }
  });

  $("board").addEventListener("input", (e) => {
    const el = e.target;
    if (!el.dataset || !el.dataset.field) return;
    draft(el.dataset.id)[el.dataset.field] = el.value;
    el.classList.remove("error");
    if (el.dataset.field === "fee") {
      const tot = $("tot-" + el.dataset.id);
      if (tot) tot.textContent = money(Number(tot.dataset.items) + (Number(el.value) || 0));
    }
  });

  $("chips").addEventListener("click", (e) => {
    const c = e.target.closest("[data-filtro]");
    if (!c) return;
    state.filtro = c.dataset.filtro;
    dibujar();
  });

  $("refresh-btn").addEventListener("click", () => cargar(true));

  // ---------------- Inicio ----------------
  pintarSonido();
  cargar();
  setInterval(cargar, POLL_MS);
</script>
</body>
</html>
